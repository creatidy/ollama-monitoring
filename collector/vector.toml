# ---------------------------------------------------------------- export
[sinks.prometheus]
type = "prometheus_exporter"
inputs = [
  "mt_slot_state",
  "mt_slots_idle",
  "mt_new_prompt",
  "mt_prompt_processing",
  "mt_live_decode",
  "mt_final_prompt_eval",
  "mt_final_eval",
  "mt_final_total",
  "mt_cache_state",
  "mt_cache_update",
  "mt_cache_full_reprocess",
  "mt_cache_eviction",
  "mt_gin",
  "mt_seen",
]
address = "0.0.0.0:9598"
# Gauge state must be last-write-wins by arrival order, not by event
