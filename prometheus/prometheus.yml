global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Journal metrics collector (Vector). The live gauges (tg_3s, prefill rate,
  # progress) update with each llama.cpp status line, so a short scrape
  # interval keeps the live view responsive without scraping absurdly fast.
  - job_name: journal-metrics
    scrape_interval: 2s
    static_configs:
      - targets: ["journal-metrics:9598"]

  # NVIDIA GPU (RTX 3090) via nvidia-smi passthrough.
  - job_name: nvidia-gpu
    scrape_interval: 10s
    static_configs:
      - targets: ["nvidia-gpu-exporter:9835"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
