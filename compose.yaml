name: ollama-monitoring

services:
  # Passive collector: reads the host systemd journal for ollama.service
  # and exports llama.cpp timing telemetry to Prometheus. Sits outside the
  # inference path; clients talk to native Ollama directly.
  journal-metrics:
    image: timberio/vector:0.49.0-debian
    container_name: ollama-journal-metrics
    restart: unless-stopped
    command: ["--config", "/etc/vector/vector.toml"]
    # bin/up detects these host values. Explicit values are useful for unusual
    # installations and for offline `docker compose config` validation.
    user: "${COLLECTOR_UID:?Run ./bin/up or set COLLECTOR_UID}:${COLLECTOR_GID:?Run ./bin/up or set COLLECTOR_GID}"
    group_add:
      - "${JOURNAL_GID:?Run ./bin/up or set JOURNAL_GID}"
    volumes:
      # Mount the whole directory: single-file bind mounts go stale when the
      # file's inode is replaced (Docker Desktop / WSL2).
      - ./collector:/etc/vector:ro
      # bin/up resolves one existing persistent or volatile source. The long
      # bind form prevents Docker from creating a missing host directory.
      - type: bind
        source: "${JOURNAL_DIR:?Run ./bin/up or set JOURNAL_DIR}"
        target: /var/log/journal
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /etc/machine-id
        target: /etc/machine-id
        read_only: true
        bind:
          create_host_path: false
      # Persistent journald cursor: after a collector restart, reading resumes
      # where it stopped instead of replaying the boot into the counters.
      - ./data/vector:/var/lib/vector-data
    ports:
      - "127.0.0.1:9598:9598"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8686 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  nvidia-gpu-exporter:
    profiles: ["nvidia"]
    image: utkuozdemir/nvidia_gpu_exporter:1.15.0
    container_name: ollama-nvidia-exporter
    restart: unless-stopped
    # NVIDIA driver + nvidia-smi are injected into the container by the WSL2
    # GPU passthrough; the exporter scrapes nvidia-smi -q output.
    gpus: all

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: ollama-prometheus
    restart: unless-stopped
    # Runs as root because the ./data bind mounts are owned by the WSL user
    # (no passwordless sudo on this box to chown to uid 65534). Acceptable for
    # a localhost-only personal stack; see README "Security notes".
    user: "0"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
    volumes:
      # Mount whole config directory (never a single mutable file: Docker
      # Desktop keeps stale bind mounts when a file's inode is replaced).
      - ./prometheus:/etc/prometheus:ro
      - ./data/prometheus:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      # /-/ready only turns 200 once startup (incl. TSDB WAL replay) finished;
      # /-/healthy answers earlier and would let Grafana query mid-replay.
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  grafana:
    image: grafana/grafana:13.0.8
    container_name: ollama-grafana
    restart: unless-stopped
    # Same root-user rationale as prometheus (WSL bind mount ownership).
    user: "0"
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Run ./bin/up to create .env or set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ollama.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./data/grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
